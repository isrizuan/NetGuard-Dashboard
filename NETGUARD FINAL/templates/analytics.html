<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGuard - Threat Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; color: #000 !important; }
            .card { border: 1px solid #ccc !important; color: #000 !important; }
            .table { color: #000 !important; }
        }
    </style>
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary no-print">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-danger" href="/dashboard">🛡️ NetGuard Security</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link active" href="/analytics">Analytics</a>
                <a class="nav-link text-warning" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Threat Analytics & Historical Reports</h2>
            <div class="no-print">
                <a href="/api/analytics/export/csv" class="btn btn-success me-2">📥 Download CSV</a>
                <button onclick="window.print()" class="btn btn-primary me-2">🖨️ Print Report</button>
                <button id="resetAnalyticsBtn" class="btn btn-outline-danger">Clear Analytics Data</button>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card bg-black border-secondary text-center p-3">
                    <h5 class="text-muted">Total Security Events</h5>
                    <h1 id="totalAlertsCount" class="text-warning">0</h1>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card bg-black border-secondary p-3">
                    <h5>Severity Breakdown</h5>
                    <canvas id="severityChart" style="max-height: 180px;"></canvas>
                </div>
            </div>
        </div>

        <div class="card bg-black border-secondary p-3">
            <h5 class="mb-3">Cumulative Historical Threat Logs</h5>
            <div class="table-responsive">
                <table class="table table-dark table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Source IP</th>
                            <th>Target IP</th>
                            <th>Threat Vector</th>
                            <th>Severity</th>
                        </tr>
                    </thead>
                    <tbody id="analyticsTableBody">
                        <tr><td colspan="5" class="text-center text-muted">Loading historical data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/analytics.js"></script>
</body>
</html>
