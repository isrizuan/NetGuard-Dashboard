<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NetGuard - Realtime Monitor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black px-4">
        <a class="navbar-brand text-warning fw-bold" href="#">🛡️ NetGuard Dashboard</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/dashboard">Monitor</a>
            <a class="nav-link" href="/analytics">Analytics</a>
            <a class="nav-link text-danger" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Search & Control Field -->
        <div class="card bg-secondary text-light p-3 mb-4 shadow">
            <div class="row g-3 align-items-center">
                <div class="col-md-5">
                    <input type="text" id="targetIpInput" class="form-control" placeholder="Enter IP address to monitor (e.g. 192.168.1.254)">
                </div>
                <div class="col-md-3">
                    <button id="searchIpBtn" class="btn btn-primary w-100">Search & Load Target</button>
                </div>
                <div class="col-md-2">
                    <button id="startMonBtn" class="btn btn-success w-100" disabled>Start Monitor</button>
                </div>
                <div class="col-md-2 text-center">
                    <span class="badge bg-dark p-2 w-100">Active Viewers: <span id="activeUsersCount">0</span></span>
                </div>
            </div>
        </div>

        <!-- Realtime Live Feeds -->
        <div class="card bg-secondary text-light p-3 shadow">
            <h5 class="text-warning">📡 Realtime Monitored Alerts</h5>
            <table class="table table-dark table-hover mt-3">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Source IP</th>
                        <th>Destination IP</th>
                        <th>Threat Type</th>
                        <th>Severity</th>
                    </tr>
                </thead>
                <tbody id="realtimeTableBody">
                    <tr><td colspan="5" class="text-center text-muted">Awaiting incoming logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
